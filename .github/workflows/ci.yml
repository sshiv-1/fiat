name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run mypy src/fiat/tools src/fiat/repository src/fiat/agents
      - run: uv run pytest
      - run: uv build
