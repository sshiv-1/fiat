[project]
name = "custom-coding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "keyring>=25.7.0",
    "openai>=3.26.0",
    "prompt-toolkit>=3.0.53",
    "pwinput>=1.0.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
]

[project.scripts]
fiat = "fiat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiat"]


