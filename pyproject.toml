[project]
name = "fiat-pup"
version = "0.1.0"
description = "A provider-agnostic, multi-agent AI coding assistant for the terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

authors = [
    { name = "Shiv Shankar" }
]

keywords = [
    "ai",
    "coding-agent",
    "ai-agent",
    "llm",
    "developer-tools",
    "cli",
    "code-generation",
    "multi-agent",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "keyring>=25.7.0",
    "openai>=3.26.0",
    "prompt-toolkit>=3.0.53",
    "pwinput>=1.0.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/sshiv-1/fiat"
Repository = "https://github.com/sshiv-1/fiat"
Issues = "https://github.com/sshiv-1/fiat/issues"

[project.scripts]
fiat = "fiat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["anthropic", "google.*", "groq", "keyring", "openai", "pwinput", "questionary"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]
